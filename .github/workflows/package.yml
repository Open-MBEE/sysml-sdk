name: Validate distributions
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    # The shared CI contains the tag-only draft-release job, disabled by publishing.
    permissions:
      contents: write
    uses: ./.github/workflows/ci.yml
    with:
      publishing: true
  validate:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: packages/
          merge-multiple: true
      - name: Select Python distributions
        run: |
          mkdir dist
          cp packages/sysml-*.whl packages/sysml-*.tar.gz dist/
      - run: python -m pip install build twine
      - run: python -m twine check --strict dist/*
      - name: Check package name, version and platform coverage
        run: python tools/check_python_distributions.py dist
      - name: Build and check wheel from source distribution
        run: |
          python -m pip wheel --no-deps dist/*.tar.gz --wheel-dir "$RUNNER_TEMP/sdist-wheels"
          python -m twine check --strict "$RUNNER_TEMP"/sdist-wheels/*
          python -m venv "$RUNNER_TEMP/sdist-test"
          "$RUNNER_TEMP/sdist-test/bin/python" -m pip install "$RUNNER_TEMP"/sdist-wheels/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/sdist-test/bin/python" -c "from sysml import Model, PayloadLibrary; from sysml.classes import PartUsage; assert Model.from_full_json([]).all() == []"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
