[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sysml"
version = "0.2.0"
description = "Spec-shaped SysML v2 SDK: generated metaclass surface over the SysML Toolkit, or over interchange payloads"
requires-python = ">=3.10"
readme = "python/PYPI.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

[project.urls]
Homepage = "https://github.com/Open-MBEE/sysml-sdk"
Repository = "https://github.com/Open-MBEE/sysml-sdk"
Issues = "https://github.com/Open-MBEE/sysml-sdk/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]
pilot = ["JPype1>=1.5"]

[tool.setuptools]
packages = ["sysml"]
package-dir = {"" = "python"}

# A platform wheel carries the binding library in _native/, the standard library models in stdlib/
# and the Pilot engine in _pilot/ (tools/package.py puts them there; the globs skip dot-files, hence
# the project files).
[tool.setuptools.package-data]
sysml = ["*.pyi", "_native/*", "_pilot/*", "stdlib/**/*", "stdlib/**/.project.json", "stdlib/**/.meta.json"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python"]
