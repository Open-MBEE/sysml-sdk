# Examples of the convenience members: small models, the element asked, and the contract's answer.
#
# Read with convenience.toml by tools/extract_convenience.py, which attaches every example to its member
# in convenience.json and checks it against the member's signature (every member has one at least). The
# answers are derived by hand from the members' OCL and the standard library's declarations; the backends
# are tested against them. `python/tests/test_convenience_examples.py` checks the examples' models on the
# backends at hand: that each element an example names is there, and has the metaclass given for it.
#
# An example names its model, the element asked (`at`, a qualified name), and optionally:
#   via     a path from that element to the one asked, of specification properties: "prop" or
#           "prop[Metaclass]" (only the values of that metaclass); every step must give one element;
#   args    the arguments by parameter name (elements by qualified name; the others take their defaults);
# and one of:
#   expect  the answer: a Boolean, number or string; "*" for unbounded; an element by qualified name, or
#           one without a name as {"@type" = metaclass, property = value, ...}; a list of those; a
#           name-keyed map as a list of [name, element] pairs. The extractor marks an answer whose
#           order the specification leaves open (a member or definition list outside the owned scope,
#           a name-keyed map: the order of membership) as unordered, and the tests compare it as a set;
#   none    true: the answer is null (none; TOML has no null);
#   refused true: the member refuses (its OCL gives invalid);
#   includes / excludes  elements a list has / does not have (where the whole list is the library's).
#
# The families' examples come from one row of facts per kind (`demos`): the holder (`at`), its owned
# members' metaclasses (in order), the answers of the list, exact and semantic variants, a name to look
# up, and a feature of the kind semantically (`semanticYes`) and one not (`semanticNo`). Names are
# relative to the holder. The extractor checks the list and exact answers against the metaclasses. The
# name-keyed maps' answers are the list's, each under its one name: the holders give their members no
# alias and no short name (the examples below show those).

# ------------------------------------------------------------------ models

[models.KindLists]
doc = "One holder per kind: members of the kind, of a subkind, of another kind, and a reference typed by the kind's definition."
text = '''
package KindLists {
    // Definitions the usages below are typed by.
    part def P;
    item def It;
    occurrence def O;
    attribute def AT;
    enum def E { enum x; }
    port def Q;
    connection def Cn;
    interface def I;
    allocation def Al;
    flow def F;
    action def A;
    state def S;
    calc def C;
    case def K;
    analysis def An;
    verification def Vc;
    use case def U;
    constraint def Ct;
    requirement def R;
    concern def Cc;
    view def Vw;
    viewpoint def Vp;
    rendering def Rd;
    metadata def M;

    // One holder per kind: members of the kind, a member of a subkind, a member of another kind, and a
    // reference typed by the kind's definition (of the kind semantically, not by its metaclass).
    part def ForFeatures { part p : P; attribute a : AT; }
    part def ForUsages { part p : P; attribute a : AT; }
    part def ForActions { action a : A; state s : S; calc c : C; part p : P; ref r : A; }
    part def ForAllocations { allocation al : Al; part p : P; ref r : Al; }
    part def ForAnalysisCases { analysis an : An; part p : P; ref r : An; }
    part def ForAttributes { attribute a : AT; enum e : E; part p : P; ref r : AT; }
    part def ForCalculations { calc c : C; case k : K; action a : A; ref r : C; }
    part def ForCases { case k : K; use case u : U; calc c : C; ref r : K; }
    part def ForConcerns { concern cc : Cc; requirement rq : R; ref r : Cc; }
    part def ForConnections { connection c : Cn; interface i : I; part p : P; ref r : Cn; }
    part def ForConstraints { constraint ct : Ct; requirement rq : R; part p : P; ref r : Ct; }
    part def ForEnumerations { enum e : E; attribute a : AT; }
    part def ForFlows { flow f : F; succession flow sf : F; action a : A; ref r : F; }
    part def ForInterfaces { interface i : I; connection c : Cn; ref r : I; }
    part def ForItems { item it : It; part p : P; attribute a : AT; ref r : It; }
    part def ForMetadata { metadata md : M; part p : P; }
    part def ForOccurrences { occurrence o : O; part p : P; attribute a : AT; ref r : O; }
    part def ForParts { part p : P; connection c : Cn; item it : It; ref r : P; }
    part def ForPorts { port q : Q; part p : P; ref r : Q; }
    part def ForReferences { ref r : P; part p : P; }
    part def ForRenderings { rendering rd : Rd; part p : P; ref r : Rd; }
    part def ForRequirements { requirement rq : R; concern cc : Cc; constraint ct : Ct; ref r : R; }
    part def ForStates { state s : S; exhibit state es : S; action a : A; ref r : S; }
    state def ForTransitions { state off; state on; transition t first off then on; }
    use case def ForUseCases { use case uc : U; include use case iu : U; case k : K; ref r : U; }
    part def ForVerificationCases { verification v : Vc; part p : P; ref r : Vc; }
    part def ForViews { view vw : Vw; part p : P; ref r : Vw; }
    part def ForViewpoints { viewpoint vp : Vp; requirement rq : R; ref r : Vp; }
}
'''

[models.DefinitionLists]
doc = "One package per definition kind: definitions of the kind, of a subkind, of another kind, and a definition of a more general kind specializing one of the kind; a package importing another; short names, a name clash, and aliases across an import."
text = '''
package DefinitionLists {
    // One package per kind: definitions of the kind, of a subkind, of another kind, and a definition
    // of a more general kind that specializes one of the kind (of the kind semantically only).
    package ForDefinitions { part def P; attribute def AT; }
    package ForActionDefs { action def A; state def S; part def P; occurrence def X :> A; }
    package ForAllocationDefs { allocation def Al; part def P; connection def X :> Al; }
    package ForAnalysisCaseDefs { analysis def An; part def P; case def X :> An; }
    package ForAttributeDefs { attribute def AT; enum def E { enum x; } part def P; }
    package ForCalculationDefs { calc def C; case def K; action def A; action def X :> C; }
    package ForCaseDefs { case def K; use case def U; calc def C; calc def X :> K; }
    package ForConcernDefs { concern def Cc; requirement def R; requirement def X :> Cc; }
    package ForConnectionDefs { connection def Cn; interface def I; part def P; }
    package ForConstraintDefs { constraint def Ct; requirement def R; part def P; }
    package ForEnumerationDefs { enum def E { enum x; } attribute def AT; }
    package ForFlowDefs { flow def F; action def A; }
    package ForInterfaceDefs { interface def I; connection def Cn; connection def X :> I; }
    package ForItemDefs { item def It; part def P; attribute def AT; occurrence def X :> It; }
    package ForMetadataDefs { metadata def M; item def It; }
    package ForOccurrenceDefs { occurrence def O; part def P; attribute def AT; }
    package ForPartDefs { part def P; connection def Cn; item def It; item def X :> P; }
    package ForPortDefs { port def Q; part def P; }
    package ForRenderingDefs { rendering def Rd; part def P; part def X :> Rd; }
    package ForRequirementDefs { requirement def R; concern def Cc; constraint def Ct; constraint def X :> R; }
    package ForStateDefs { state def S; action def A; action def X :> S; }
    package ForUseCaseDefs { use case def U; case def K; case def X :> U; }
    package ForVerificationCaseDefs { verification def Vc; case def K; case def X :> Vc; }
    package ForViewDefs { view def Vw; part def P; part def X :> Vw; }
    package ForViewpointDefs { viewpoint def Vp; requirement def R; requirement def X :> Vp; }

    // Scope: owned, imported only, or both; an alias makes Local a member twice.
    package Imports { public import ForPartDefs::*; part def Local; alias LocalAlias for Local; }

    // Names: a short name is a name too. Two definitions with one name, both part definitions: whether
    // a namespace may hold them (whether distinguishability considers the metaclass) is an open
    // question; the backends load them, and a map refuses the name either way.
    package ShortNames { part def <w> Wheel; }
    package Clash { connection def Twin; view def Twin; }

    // Aliases across an import: a package's own alias for a definition it imports, and an imported alias
    // for a definition the package owns. A map's keys are every name a definition has in the namespace.
    package Aliased { public import ForPartDefs::*; alias Primary for ForPartDefs::P; }
    package Owner { part def Wheel; public import Aliases::*; }
    package Aliases { alias Rim for Owner::Wheel; }
}
'''

[models.Scopes]
doc = "Owned, inherited and redefined members, their visibility, and a usage; a supertype that imports a feature; a conjugated port definition."
text = '''
package Scopes {
    part def P;
    part def Base { part a : P; protected part b : P; private part c : P; }
    part def Derived :> Base { part d : P; part :>> a; private part e : P; }
    part instance : Derived { part f : P; }

    // A supertype that imports a feature: Heir inherits q1 by name, but q1 is not a feature of Heir.
    package Lib { part def Q { part q1 : P; } }
    part def Importer { public import Lib::Q::*; part own : P; }
    part def Heir :> Importer;

    // A conjugated port definition: its original type's features are its inherited features.
    port def Pt { in item i; out item o; }
}
'''

[models.Members]
doc = "Members that are not features of their namespace: usages in a package, variants, enumeration literals, an alias, an imported member."
text = '''
package Members {
    part def Wheel;
    package Lib { part spareWheel : Wheel; }
    part car : Wheel;
    enum def Color { enum red; enum green; }
    variation part def Body { variant part sedan; variant part coupe; }
    part def Car {
        public import Lib::*;
        part engine;
        alias motor for engine;
    }
}
'''

[models.MetaDefs]
doc = "Metadata in a metadata definition, in a part definition and in a metadata usage's body, and inherited."
text = '''
package MetaDefs {
    metadata def N;
    metadata def M {
        attribute level : ScalarValues::Integer;
        metadata n : N;
        @N;
    }
    metadata def Tagged :> M;
    part def P {
        metadata m : M { :>> level = 1; metadata inner : N; }
    }
    part def Q :> P;
}
'''

[models.Typing]
doc = "Typing, specialization, subsetting, redefinition, reference subsetting, a conjugated port definition and a feature chain."
text = '''
package Typing {
    part def Vehicle;
    part def Car :> Vehicle;
    part def Engine;
    port def Plug;
    part def Wheel;
    part def Frame {
        attribute mass : ScalarValues::Real;
        part wheels : Wheel[4];
        part engine : Engine;
    }
    part def Body :> Frame {
        attribute :>> mass;
        part frontWheels :> wheels;
        ref part spare ::> wheels;
        part motor :> engine;
    }
    part def Truck :> Body { attribute :>> mass; }
    part def Battery { port powerOut : Plug; }
    part def Pack { part battery : Battery; port output :> battery.powerOut; }
}
'''

[models.Values]
doc = "Values: literals, signs, units, expressions, references, defaults, initial values, classification and cast."
text = '''
package Values {
    private import SI::*;
    part def Car;
    part def Settings {
        attribute count = 4;
        attribute ratio = 0.5;
        attribute enabled = true;
        attribute label = "front";
        attribute offset = -5;
        attribute mass = 1500 [kg];
        attribute drag = -5 [kg];
        attribute speed = 3 [m/s];
        attribute twice = 2 * count;
        attribute other = count;
        attribute none;
        attribute fallback default = 3;
        ref part car : Car;
        attribute isCar = car istype Car;
        attribute asCar = car as Car;
    }
    part def Tank { attribute level := 2; }
}
'''

[models.Bounds]
doc = "Multiplicities: a single bound, a range, unbounded, an expression, ordered, and a type without one."
text = '''
package Bounds {
    part def W;
    part def V {
        attribute n : ScalarValues::Integer;
        part two : W[2];
        part upToThree : W[0..3];
        part atLeastOne : W[1..*];
        part many : W[*];
        part counted : W[n];
        part sorted : W[*] ordered;
        part sortedToo :> sorted;
        ref part plain : W;
    }
}
'''

[models.Behaviour]
doc = "Parameters, inputs and outputs, result expressions, initial states, accepted types, and features specializing another."
text = '''
package Behaviour {
    private import ScalarValues::*;
    item def Fuel;
    attribute def Sig;
    attribute def SubSig :> Sig;
    port def Socket { in item plugIn : Fuel; out attribute status : Sig; inout item exchange : Fuel; }
    action def Pump { in item fuelIn : Fuel; out item fuelOut : Fuel; attribute rate : Real; }
    action pump : Pump { in item fuelIn; }
    calc def Double { in x : Real; 2 * x }
    constraint def Positive { in x : Real; x > 0 }
    calc half { in x : Real; x / 2 }
    part def Wheel;
    part def Vehicle { part wheels : Wheel[4]; part frontWheels :> wheels[2]; part engine; }
    action def Listen { action acc accept sig : Sig; }
    state def Machine { entry; then off; state off; state on; transition t first off accept Sig then on; }
    state def Machine2 { state off; state on; first start then off; }
    state def Machine3 { entry; then on; state off; state on; first start then off; }
    state lamp { entry; then dark; state dark; state lit; }
}
'''

[models.Structure]
doc = "Packages, variants, enumeration literals, applied metadata and documentation."
text = '''
package Structure {
    metadata def Safety;
    package Outer { package Inner; part def P; }
    variation part def Body { variant part sedan; variant part coupe; }
    enum def Color { enum red; enum green; }
    #Safety part def Brake;
    part def Car {
        @Safety;
        doc /* A car. */
        part body : Body;
    }
    part def Truck {
        doc
        /*
         * A truck.
         * It has six wheels.
         */
    }
}
'''

