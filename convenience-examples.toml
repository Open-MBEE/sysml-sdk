# ------------------------------------------------------------------ behaviour

[[example]]
member = "findParameters"
model = "Behaviour"
at = "Behaviour::Pump"
expect = ["Behaviour::Pump::fuelIn", "Behaviour::Pump::fuelOut"]
note = "rate has no direction."

[[example]]
member = "findParameters"
model = "Behaviour"
at = "Behaviour::pump"
expect = ["Behaviour::pump::fuelIn"]
note = "On a step: its own parameters."

[[example]]
member = "findInputs"
model = "Behaviour"
at = "Behaviour::Pump"
expect = ["Behaviour::Pump::fuelIn"]
note = "fuelOut is out; rate has no direction."

[[example]]
member = "findInputs"
model = "Behaviour"
at = "Behaviour::Socket"
expect = ["Behaviour::Socket::plugIn", "Behaviour::Socket::exchange"]
note = "An inout feature is an input and an output."

[[example]]
member = "findInputs"
model = "Behaviour"
at = "Behaviour::Socket::'~Socket'"
args = { scope = "all" }
expect = ["Behaviour::Socket::status", "Behaviour::Socket::exchange"]
note = "Conjugation reverses in and out: the conjugated port's inputs are the original's outputs."

[[example]]
member = "findOutputs"
model = "Behaviour"
at = "Behaviour::Pump"
expect = ["Behaviour::Pump::fuelOut"]

[[example]]
member = "findOutputs"
model = "Behaviour"
at = "Behaviour::Socket"
expect = ["Behaviour::Socket::status", "Behaviour::Socket::exchange"]

[[example]]
member = "findOutputs"
model = "Behaviour"
at = "Behaviour::Socket::'~Socket'"
args = { scope = "all" }
expect = ["Behaviour::Socket::plugIn", "Behaviour::Socket::exchange"]
note = "Conjugation reverses in and out."

[[example]]
member = "findSubsettingFeaturesOf"
model = "Behaviour"
at = "Behaviour::Vehicle"
args = { feature = "Behaviour::Vehicle::wheels" }
expect = ["Behaviour::Vehicle::wheels", "Behaviour::Vehicle::frontWheels"]
note = "A feature specializes itself."

[[example]]
member = "findResultExpression"
model = "Behaviour"
at = "Behaviour::Double"
expect = { "@type" = "OperatorExpression", operator = "*" }

[[example]]
member = "findResultExpression"
model = "Behaviour"
at = "Behaviour::Positive"
expect = { "@type" = "OperatorExpression", operator = ">" }

[[example]]
member = "findResultExpression"
model = "Behaviour"
at = "Behaviour::half"
expect = { "@type" = "OperatorExpression", operator = "/" }
note = "On a calculation usage."

[[example]]
member = "findInitialStates"
model = "Behaviour"
at = "Behaviour::Machine"
expect = ["Behaviour::Machine::off"]
note = "entry; then off;"

[[example]]
member = "findInitialStates"
model = "Behaviour"
at = "Behaviour::Machine2"
expect = ["Behaviour::Machine2::off"]
note = "first start then off;"

[[example]]
member = "findInitialStates"
model = "Behaviour"
at = "Behaviour::Machine3"
expect = ["Behaviour::Machine3::off"]
note = "Both forms: first start then off; comes first."

[[example]]
member = "findInitialStates"
model = "Behaviour"
at = "Behaviour::lamp"
expect = ["Behaviour::lamp::dark"]
note = "On a state usage."

