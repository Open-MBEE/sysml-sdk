# ------------------------------------------------------------------ the shared arguments, on findParts

[[example]]
member = "findParts"
model = "Scopes"
at = "Scopes::Derived"
expect = ["Scopes::Derived::d", "Scopes::Derived::a", "Scopes::Derived::e"]
note = "Owned, by default: the redefining a among them, the private e too."

[[example]]
member = "findParts"
model = "Scopes"
at = "Scopes::Derived"
args = { scope = "inherited" }
expect = ["Scopes::Base::b"]
note = "Base::a is redefined in Derived, so not inherited as it is; the private c is not inherited."

[[example]]
member = "findParts"
model = "Scopes"
at = "Scopes::Derived"
args = { scope = "all" }
expect = ["Scopes::Derived::d", "Scopes::Derived::a", "Scopes::Derived::e", "Scopes::Base::b"]

[[example]]
member = "findParts"
model = "Scopes"
at = "Scopes::Derived"
args = { scope = "all", visibility = "public" }
expect = ["Scopes::Derived::d", "Scopes::Derived::a"]

[[example]]
member = "findParts"
model = "Scopes"
at = "Scopes::Derived"
args = { scope = "all", visibility = "protected" }
expect = ["Scopes::Derived::d", "Scopes::Derived::a", "Scopes::Base::b"]

[[example]]
member = "findParts"
model = "Scopes"
at = "Scopes::Derived"
args = { scope = "inherited", library = true }
includes = ["Scopes::Base::b", "Parts::Part::start", "Items::Item::subparts"]
excludes = ["Scopes::Base::a"]
note = "With the standard library's members: those Derived inherits through Parts::Part."

[[example]]
member = "findParts"
model = "Scopes"
at = "Scopes::instance"
expect = ["Scopes::instance::f"]
note = "On a usage: the specification's nestedPart."

[[example]]
member = "findParts"
model = "Members"
at = "Members::Body"
expect = []
note = "Variants are not features of their variation: findMemberParts finds them."

[[example]]
member = "findEnumerations"
model = "Members"
at = "Members::Color"
expect = []
note = "Enumeration literals are variants, not features: findMemberEnumerations finds them."

[[example]]
member = "findPart"
model = "Scopes"
at = "Scopes::Derived"
args = { name = "a" }
expect = "Scopes::Derived::a"
note = "The redefining feature, found by its effective name."

[[example]]
member = "findPart"
model = "Scopes"
at = "Scopes::Derived"
args = { name = "b" }
none = true
note = "Not owned: inherited."

[[example]]
member = "findPart"
model = "Scopes"
at = "Scopes::Derived"
args = { name = "b", scope = "inherited" }
expect = "Scopes::Base::b"

[[example]]
member = "findParts"
model = "Scopes"
at = "Scopes::Heir"
args = { scope = "inherited" }
expect = ["Scopes::Importer::own"]
note = "q1, which Importer imports, is inherited by name but owned by Q, which is not a supertype of Heir, so it is not a feature of Heir (KERML11-191). findMemberParts has it."

[[example]]
member = "findParts"
model = "Scopes"
at = "Scopes::Heir"
args = { scope = "all" }
expect = ["Scopes::Importer::own"]
note = "All is the owned features followed by the inherited ones."

[[example]]
member = "findMemberParts"
model = "Scopes"
at = "Scopes::Heir"
args = { scope = "inherited" }
expect = ["Scopes::Importer::own", "Scopes::Lib::Q::q1"]
note = "By name, q1 is inherited: Importer imports it publicly."

[[example]]
member = "findItems"
model = "Scopes"
at = "Scopes::Pt"
via = ["conjugatedPortDefinition"]
args = { scope = "all" }
expect = ["Scopes::Pt::i", "Scopes::Pt::o"]
note = "A conjugated port definition's features are its original type's, its only supertype."

[[example]]
member = "findItems"
model = "Scopes"
at = "Scopes::Pt"
via = ["conjugatedPortDefinition"]
expect = []
note = "It owns none."

