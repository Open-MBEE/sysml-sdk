model = "DefinitionLists"
at = "DefinitionLists::Imports"
args = { scope = "all" }
expect = ["DefinitionLists::Imports::Local", "DefinitionLists::ForPartDefs::P", "DefinitionLists::ForPartDefs::Cn"]
note = "Local once, though the alias LocalAlias is a membership of it too."

[[example]]
