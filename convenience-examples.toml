model = "Members"
at = "Members"
expect = ["Members::car"]
note = "A package's usages, owned by OwningMemberships."

[[example]]
member = "findMemberParts"
model = "Members"
at = "Members::Body"
expect = ["Members::Body::sedan", "Members::Body::coupe"]
note = "Variants, owned by VariantMemberships."

[[example]]
member = "findMemberEnumerations"
model = "Members"
at = "Members::Color"
expect = ["Members::Color::red", "Members::Color::green"]

[[example]]
member = "findMemberAttributes"
model = "Members"
at = "Members::Color"
expect = ["Members::Color::red", "Members::Color::green"]

[[example]]
member = "findMemberParts"
model = "Members"
at = "Members::Car"
expect = ["Members::Car::engine"]
note = "engine once, though the alias motor is a membership of it too."

[[example]]
member = "findMemberParts"
model = "Members"
at = "Members::Car"
args = { scope = "inherited" }
expect = ["Members::Lib::spareWheel"]
note = "Imported; the parts Car inherits from Parts::Part are the standard library's."

[[example]]
member = "findMemberParts"
model = "Members"
at = "Members::Car"
args = { scope = "all" }
expect = ["Members::Car::engine", "Members::Lib::spareWheel"]

[[example]]
member = "findMemberPart"
model = "Members"
at = "Members::Car"
args = { name = "motor" }
expect = "Members::Car::engine"
note = "Through the alias's name."

[[example]]
member = "findMemberPart"
model = "Members"
at = "Members::Car"
args = { name = "spareWheel", scope = "all" }
expect = "Members::Lib::spareWheel"

[[example]]
member = "findMemberPart"
model = "Members"
at = "Members"
args = { name = "car" }
expect = "Members::car"

[[example]]
member = "findMemberMetadata"
model = "MetaDefs"
at = "MetaDefs::M"
expect = ["MetaDefs::M::n", { "@type" = "MetadataUsage", metaclass = "MetaDefs::N" }]
note = "In a metadata definition, as in any body: owned through OwningMemberships, annotating M."

[[example]]
member = "findMemberMetadata"
model = "MetaDefs"
at = "MetaDefs::P::m"
expect = ["MetaDefs::P::m::inner"]
note = "In a metadata usage's body; its :>> level = 1 is a ReferenceUsage, not metadata."

[[example]]
member = "findMemberMetadata"
model = "MetaDefs"
at = "MetaDefs::Tagged"
expect = []
note = "Owned only: M's metadata annotates M, not its specializations."

[[example]]
member = "findMemberMetadata"
model = "KindLists"
at = "KindLists::ForMetadata"
expect = ["KindLists::ForMetadata::md"]

[[example]]
member = "findMemberMetadata"
model = "Structure"
at = "Structure::Car"
expect = [{ "@type" = "MetadataUsage", metaclass = "Structure::Safety" }]

