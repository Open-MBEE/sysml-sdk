[[example]]
member = "findPartDefsByName"
model = "DefinitionLists"
at = "DefinitionLists::Imports"
expect = [["Local", "DefinitionLists::Imports::Local"], ["LocalAlias", "DefinitionLists::Imports::Local"]]
note = "Owned, by default: Local under its own name and under the alias's."

[[example]]
member = "findPartDefsByName"
model = "DefinitionLists"
at = "DefinitionLists::Imports"
args = { scope = "inherited" }
expect = [["P", "DefinitionLists::ForPartDefs::P"], ["Cn", "DefinitionLists::ForPartDefs::Cn"]]
note = "Imported only."

[[example]]
member = "findPartDefsByName"
model = "DefinitionLists"
at = "DefinitionLists::Imports"
args = { scope = "all" }
expect = [["Local", "DefinitionLists::Imports::Local"], ["LocalAlias", "DefinitionLists::Imports::Local"], ["P", "DefinitionLists::ForPartDefs::P"], ["Cn", "DefinitionLists::ForPartDefs::Cn"]]
note = "The owned memberships' names (the alias among them) and the imported ones', in an order the specification leaves to the backend."

[[example]]
member = "findPartDefsByName"
model = "DefinitionLists"
at = "DefinitionLists::ShortNames"
expect = [["Wheel", "DefinitionLists::ShortNames::Wheel"], ["w", "DefinitionLists::ShortNames::Wheel"]]
note = "The short name is a key too, after the name."

[[example]]
member = "findPartDefsByName"
model = "DefinitionLists"
at = "DefinitionLists::Clash"
refused = true
note = "Twin names a connection definition and a view definition, both part definitions; the map would keep one."

[[example]]
member = "findPartDefsByName"
model = "DefinitionLists"
at = "DefinitionLists::Aliased"
expect = []
note = "The package owns no part definition: its alias Primary names an imported one, so it is not a key under owned."

[[example]]
member = "findPartDefsByName"
model = "DefinitionLists"
at = "DefinitionLists::Aliased"
args = { scope = "inherited" }
expect = [["Primary", "DefinitionLists::ForPartDefs::P"], ["P", "DefinitionLists::ForPartDefs::P"], ["Cn", "DefinitionLists::ForPartDefs::Cn"]]
note = "Imported P under the package's own alias too, which comes first as an owned membership."

[[example]]
member = "findPartDefsByName"
model = "DefinitionLists"
at = "DefinitionLists::Owner"
expect = [["Wheel", "DefinitionLists::Owner::Wheel"], ["Rim", "DefinitionLists::Owner::Wheel"]]
note = "Owned Wheel under the imported alias Rim too."

[[example]]
member = "findPartDefsByName"
model = "DefinitionLists"
at = "DefinitionLists::Owner"
args = { scope = "inherited" }
expect = []
note = "Rim is imported, but it names an owned definition, which the inherited scope leaves out."

[[example]]
member = "findPortDefs"
model = "DefinitionLists"
at = "DefinitionLists::ForPortDefs::Q"
expect = ["DefinitionLists::ForPortDefs::Q::'~Q'"]
note = "A port definition owns its conjugated port definition."

[[example]]
member = "findPortDefsExact"
model = "DefinitionLists"
at = "DefinitionLists::ForPortDefs::Q"
expect = []
note = "The conjugated port definition is a ConjugatedPortDefinition, a subkind."

